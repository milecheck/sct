<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="Figtree, Helvetica, Arial, sans-serif">
  <title>How to load a pack: sleeping bag at the bottom, heavy items in the middle against your back, rain gear on top, small items in the lid, bear spray on the hip belt</title>
  <rect width="800" height="640" fill="#f5f8f7"/>
  <!-- back label -->
  <text x="60" y="330" font-size="15" font-weight="700" fill="#536970" transform="rotate(-90 60 330)" text-anchor="middle">YOUR BACK</text>
  <line x1="84" y1="110" x2="84" y2="560" stroke="#536970" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- pack body -->
  <path d="M100 150 Q100 120 130 118 L330 118 Q360 120 360 150 L372 540 Q372 572 340 572 L126 572 Q96 572 98 540 Z" fill="#fff" stroke="#102830" stroke-width="4"/>
  <!-- lid -->
  <path d="M104 118 Q110 70 160 66 L310 66 Q352 70 358 118 Z" fill="#d2dcde" stroke="#102830" stroke-width="4"/>
  <!-- zones -->
  <path d="M104 124 L356 124 L360 250 L102 250 Z" fill="#9ec3cc"/>
  <path d="M102 250 L360 250 L366 430 L100 430 Z" fill="#0d5668"/>
  <path d="M100 430 L366 430 L370 540 Q370 566 340 566 L126 566 Q102 566 100 540 Z" fill="#6f9a8a"/>
  <!-- heavy core hint: darker strip against back -->
  <rect x="102" y="250" width="70" height="180" fill="#062f3b"/>
  <!-- hip belt with bear spray -->
  <rect x="84" y="468" width="300" height="34" rx="8" fill="#174c3b" stroke="#102830" stroke-width="3"/>
  <rect x="382" y="444" width="34" height="78" rx="10" fill="#e84a31" stroke="#102830" stroke-width="3"/>
  <!-- redraw outline over fills -->
  <path d="M100 150 Q100 120 130 118 L330 118 Q360 120 360 150 L372 540 Q372 572 340 572 L126 572 Q96 572 98 540 Z" fill="none" stroke="#102830" stroke-width="4"/>
  <!-- labels -->
  <g font-size="19" fill="#102830">
    <line x1="300" y1="92" x2="470" y2="92" stroke="#102830" stroke-width="2"/>
    <text x="480" y="88" font-weight="800">LID</text>
    <text x="480" y="112">Phone, snacks, headlamp</text>

    <line x1="340" y1="186" x2="470" y2="186" stroke="#102830" stroke-width="2"/>
    <text x="480" y="182" font-weight="800">TOP</text>
    <text x="480" y="206">Rain shell, warm layer,</text>
    <text x="480" y="230">filter, first aid</text>

    <line x1="340" y1="340" x2="470" y2="340" stroke="#102830" stroke-width="2"/>
    <text x="480" y="332" font-weight="800">MIDDLE, AGAINST YOUR BACK</text>
    <text x="480" y="356">Food, cook kit, water.</text>
    <text x="480" y="380">The heaviest things go here.</text>

    <line x1="416" y1="484" x2="470" y2="470" stroke="#102830" stroke-width="2"/>
    <text x="480" y="462" font-weight="800" fill="#b8321d">BEAR SPRAY</text>
    <text x="480" y="486">On the hip belt, in reach</text>

    <line x1="340" y1="540" x2="470" y2="556" stroke="#102830" stroke-width="2"/>
    <text x="480" y="552" font-weight="800">BOTTOM</text>
    <text x="480" y="576">Sleeping bag, camp clothes</text>
  </g>
</svg>
